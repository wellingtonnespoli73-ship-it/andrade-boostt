name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build application
        run: npm run build
      - name: Capture application preview
        run: npx electron scripts/capture-preview.cjs
      - name: Upload application preview
        uses: actions/upload-artifact@v4
        with:
          name: AndradeBoost-Preview
          path: preview/*.png
          if-no-files-found: error
      - name: Build installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AndradeBoost-Windows
          path: |
            release/*.exe
            release/latest*.yml
          if-no-files-found: error
